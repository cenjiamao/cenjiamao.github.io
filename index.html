<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 22px;
    background:#fbf4ea;color:#6b5d52;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.7}
  .card{width:100%;max-width:360px;background:#fffdf8;border:1.5px solid #ece0d1;border-radius:22px;
    padding:30px 26px 24px;text-align:center;box-shadow:0 14px 34px rgba(120,105,85,.10)}
  .logo{width:60px;height:60px;border-radius:16px;margin:0 auto 14px;display:block}
  h1{margin:0 0 8px;font-size:19px;font-weight:700;color:#5c5348;letter-spacing:.02em}
  p{margin:0 0 6px;font-size:13.5px;color:#8c7e70}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid #d8bd86;border-top-color:transparent;
    border-radius:50%;vertical-align:-2px;margin-right:6px;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .go{display:block;margin:18px auto 4px;padding:12px 22px;border-radius:14px;text-decoration:none;
    background:#9bbfa6;color:#fff;font-size:15px;font-weight:600;box-shadow:0 6px 16px rgba(122,163,137,.35)}
  .go:active{transform:scale(.97)}
  .go.ghost{background:#fffdf8;color:#7aa389;border:1.5px solid #cfe0d4;box-shadow:none;font-weight:500}
  .fine{margin-top:14px;font-size:11.5px;color:#ad9f90;line-height:1.8}
  .kb{font-size:12px;color:#a39a8c;margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" alt="" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2NCA2NCc+PHJlY3Qgd2lkdGg9JzY0JyBoZWlnaHQ9JzY0JyByeD0nMTQnIGZpbGw9JyNmYmY0ZWEnLz48Y2lyY2xlIGN4PSczMicgY3k9JzMyJyByPScyMCcgZmlsbD0nIzliYmZhNicvPjxwYXRoIGQ9J00yNCAzMmw2IDYgMTItMTQnIGZpbGw9J25vbmUnIHN0cm9rZT0nI2ZmZmZmZicgc3Ryb2tlLXdpZHRoPSc1JyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnLz48L3N2Zz4=">
  <h1>🌻 日常小台搬新家啦</h1>
  <p>为了手机、电脑数据自动互通，日常小台搬到了新地址。</p>
  <div id="msg"><p style="margin-top:10px"><span class="spin"></span>正在自动跳转，本机记的内容会一起搬过去，不会丢～</p></div>
  <a class="go" id="goBtn" href="https://selfmedia-workbench-43339.app.workbuddy.host/desk/">如未跳转，点这里打开新工作台 ›</a>
  <p class="fine">旧数据只存放在这台设备里，跳转后会自动合并进新工作台。<br>以后记得用新网址哦 ✨</p>
</div>
<script>
(function(){
  var TARGET='https://selfmedia-workbench-43339.app.workbuddy.host/desk/';
  var KEYS=['checkin','todo','memo','idea','summary','meta'];
  var MAX_B64=40000; /* 超过约 30KB 原始数据就走手动下载，避免超长网址跳转失败 */
  function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
  var payload={},has=false;
  KEYS.forEach(function(k){var raw=ls('wb_desk_'+k);if(raw){payload[k]=raw;has=true}});
  var goBtn=document.getElementById('goBtn');
  function finish(url){setTimeout(function(){location.replace(url)},350);}
  if(has){
    var json=JSON.stringify(payload);
    var b64='';
    try{b64=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){}
    if(b64&&b64.length<=MAX_B64){
      finish(TARGET+'#m='+b64);
    }else{
      /* 数据太多：给手动搬家方案（下载备份 → 新工作台导入） */
      var kb=Math.round(json.length/1024);
      document.getElementById('msg').innerHTML='<p class="kb">检测到本机数据较多（约 '+kb+' KB），为避免跳转丢失，请二选一：</p>';
      goBtn.textContent='⬇︎ 下载本机备份文件';
      goBtn.onclick=function(e){
        e.preventDefault();
        var b=new Blob([json],{type:'application/json;charset=utf-8'});
        var u=URL.createObjectURL(b),a=document.createElement('a');
        var d=new Date(),p=function(n){return (n<10?'0':'')+n};
        a.href=u;a.download='workbench-backup-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u)},1000);
      };
      var second=document.createElement('a');
      second.className='go ghost';second.href=TARGET;second.textContent='直接打开新工作台 ›';
      second.style.marginTop='10px';
      goBtn.parentNode.insertBefore(second,goBtn.nextSibling);
      document.querySelector('.fine').innerHTML='下载备份文件后，在新工作台「汇总」页点「⬆︎ 导入备份」即可恢复～';
    }
  }else{
    finish(TARGET);
  }
})();
</script>
</body>
</html>
